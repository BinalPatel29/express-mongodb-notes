<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="register">
        <h1>Register Here!</h1>

        <div id="errorMessage"></div>
        <div id="successMessage"></div>
        
        <form id = "registerForm">
           <div id="input-field">
                <div class="name-row">
                    <div class="form-group">
                        <label for="fname">FirstName:</label><br>
                        <input type="text" id="fname" placeholder="Enter your first name" required>
                    </div>
                    <div class="form-group">
                        <label for="lname">LastName:</label><br>
                        <input type="text" id="lname" placeholder="Enter your last name" required>
                    </div>
                </div>
                <br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" placeholder="Enter your email" required><br><br>
                <label for="password" >Password:</label><br>
                <input type="password" id="password" name="password" minlength="6" placeholder="Enter your password" required><br><br>
                <label for="mobno">Mobile No:</label><br>
                <input type="tel" id="mobno" maxlength="10" pattern="[0-9]{10}" placeholder="Enter your phone number"><br><br>
                <input type="submit" value="Register">
            </div>
        </form>

        <p>Already have an account? <a href="/frontend/index.html">Login here</a></p>
    </div>

    <script type="module" src="../js/auth.js"></script>

</body>
</html>

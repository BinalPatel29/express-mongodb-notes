name: Run Tests

# Trigger this workflow on every push or pull request
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Match your local Node version
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        env:
          FORCE_COLOR: 1 # This forces the terminal to output green/red colors
        run: npm test

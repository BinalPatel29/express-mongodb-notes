name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Native Image Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Clear MongoDB Binary Cache
        run: rm -rf ~/.cache/mongodb-memory-server

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        env:
          FORCE_COLOR: 1
          NODE_ENV: test
          JWT_SECRET: test-environment-jwt-secret-key-12345
          REFRESH_TOKEN_SECRET: test-environment-refresh-secret-key-67890
          REDIS_URL: redis://localhost:6379
        run: npm test
